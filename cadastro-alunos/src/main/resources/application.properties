spring.application.name=cadastro-alunos

# Conexão apontando para o localhost (Porta padrão do MySQL do XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/Faculdade?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root

# Deixe a senha completamente vazia após o sinal de igual (=)
spring.datasource.password=

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostra o SQL no console para termos certeza de que funcionou
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true